<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Agentic Academy: Knowledge Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Keep a fixed size for the extension popup */
    html,
    body {
      width: 600px;
      height: 400px;
      overflow: hidden;
    }

    .calendar-column {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .calendar-cell {
      width: 12px;
      height: 12px;
      background-color: #ebedf0;
      /* Default color */
      border: 1px solid rgba(27, 31, 35, 0.06);
      border-radius: 2px;
    }

    .calendar-cell-empty {
      background-color: transparent;
      border: none;
    }

    .calendar-month-label {
      font-size: 10px;
      text-align: center;
    }
  </style>
</head>

<body class="d-flex flex-column bg-white rounded">

  <div id="login-view" class="container p-4 d-flex flex-column justify-content-center align-items-center h-100">
    <h3 class="text-center mb-3">Agentic Academy</h3>
    <p class="text-muted">Please log in to track your knowledge.</p>
    <div class="d-grid col-6 mx-auto">
      <button id="login-button" class="btn btn-primary">Login on Website</button>
    </div>
  </div>

  <div id="app-view" class="d-flex flex-column h-100 p-2" style="display: none;">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="h5 mb-0" id="e-header">Knowledge Tracker</h1>
      <button id="logout-button" class="btn btn-sm btn-outline-secondary">Logout</button>
    </div>

    <ul class="nav nav-pills my-2 gap-2" id="tabBar" role="tablist"></ul>

    <div class="tab-content flex-grow-1 d-flex flex-column" style="min-height: 0;">
      <div class="tab-pane fade show active h-100" id="trackerTab" role="tabpanel">
        <div id="trackingPanel"></div>
        <div id="monthLabels" class="d-flex gap-1" style="margin-left: 26px;"></div>
        <div id="calendarContainer" class="d-flex gap-2 mt-1">
          <div class="d-flex flex-column justify-content-between" style="font-size: 10px;">
            <span>Monday</span><span>Wed</span><span>Fri</span>
          </div>
          <div id="calendar" class="d-flex gap-1"></div>
        </div>
      </div>

      <div class="tab-pane fade h-100 d-flex flex-column" id="chatTab" role="tabpanel" style="min-height: 0;">
        <div id="chatWindow" class="flex-grow-1 border rounded p-2 overflow-y-auto bg-white" style="min-height: 0;">
        </div>
        <div id="chatInputContainer" class="mt-2"></div>
      </div>

      <div class="tab-pane fade" id="learnTab" role="tabpanel">
        <p>Learning content coming soon…</p>
      </div>
    </div>
    <div id="tooltip"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
